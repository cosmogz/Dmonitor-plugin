name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: dmonitor
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache backend npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('backend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install backend deps
        run: |
          cd backend
          npm ci
      - name: Wait for Postgres
        run: |
          for i in {1..10}; do pg_isready -h localhost -p 5432 -U postgres && break || sleep 1; done
      - name: Run migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/dmonitor
        run: |
          cd backend
          node scripts/migrate.js
      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/dmonitor
          REDIS_URL: redis://localhost:6379
        run: |
          cd backend
          npm test -- --runInBand
name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci
        working-directory: backend
      - name: Run unit tests
        run: npm test --silent
        working-directory: backendname: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint || true
      - name: Run tests
        run: npm test

  otel-smoke:
    runs-on: ubuntu-latest
    needs: test
    services:
      otelcol:
        image: otel/opentelemetry-collector-contrib:0.70.0
        ports:
          - 4318:4318
        options: >-
          --health-cmd='curl -sSf http://localhost:4318/metrics || exit 1' --health-interval=5s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache backend npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('backend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install backend deps
        run: |
          cd backend
          npm ci
      - name: Run OTEL smoke test
        env:
          OTEL_ENABLED: 'true'
          OTEL_EXPORTER_OTLP_ENDPOINT: 'http://localhost:4318/v1/traces'
        run: |
          cd backend
          npm run otel:smoke
