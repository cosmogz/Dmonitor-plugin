name: Backend integration tests

on:
  pull_request:
    branches: [ main ]

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        ports: ['5432:5432']
        env:
          POSTGRES_DB: dmonitor
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: backend

      - name: Start mock webhook server and Run integration tests
        run: |
          # start a simple node webhook listener in background to accept POSTs
          node -e "const http=require('http');const srv=http.createServer((req,res)=>{if(req.method==='POST'){let b='';req.on('data',c=>b+=c);req.on('end',()=>{console.log('webhook got',b);res.writeHead(200);res.end('ok');});}else{res.writeHead(200);res.end('ok');}});srv.listen(4321,()=>console.log('webhook listening on 4321'));" &
          export DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/dmonitor
          export REDIS_URL=redis://127.0.0.1:6379
          export BASE_URL=http://127.0.0.1:4002
          export NOTIFICATION_WEBHOOK_URL=http://127.0.0.1:4321/hook
          cd backend
          npm run test:integration

      - name: Post PR comment on success
        if: ${{ success() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            const body = `✅ Backend integration tests passed for this PR. Artifacts: none.`;
            await github.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, body });
