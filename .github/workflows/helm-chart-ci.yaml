name: Helm Chart CI

on:
  pull_request:
    paths:
      - 'charts/dmonitor/**'
  push:
    branches: [ main ]
    paths:
      - 'charts/dmonitor/**'

jobs:
  lint-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Helm
        uses: azure/setup-helm@v3
      - name: Helm lint
        run: helm lint --strict charts/dmonitor
      - name: Helm template
        run: helm template charts/dmonitor --values charts/dmonitor/values.yaml
      - name: Helm package
        run: |
          mkdir -p artifacts
          helm package charts/dmonitor -d artifacts
      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: artifacts/*.tgz
