name: Build and publish image + SBOM

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dmonitor:latest
            ghcr.io/${{ github.repository_owner }}/dmonitor:${{ github.sha }}
          file: Dockerfile

      - name: Generate SBOM (Syft)
        uses: anchore/syft-action@v0.8.1
        with:
          image: ghcr.io/${{ github.repository_owner }}/dmonitor:${{ github.sha }}
          output-file: dmonitor-${{ github.sha }}-sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmonitor-sbom
          path: dmonitor-${{ github.sha }}-sbom.json

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v1
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/dmonitor:${{ github.sha }}
          format: 'table'
          exit-code: '1'
