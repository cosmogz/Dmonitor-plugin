name: Backend local test

on:
  workflow_dispatch: {}

jobs:
  run-migrations-and-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: dmonitor
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U postgres
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Postgres
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          cd backend
          npm ci

      - name: Run migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/dmonitor
        run: |
          cd backend
          npm run migrate

      - name: Smoke test server (start & curl)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/dmonitor
        run: |
          cd backend
          PORT=4001 npm start &
          sleep 2
          curl -fS --retry 3 http://localhost:4001/health
