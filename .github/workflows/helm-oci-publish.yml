name: Publish Helm Chart (OCI to GHCR)

on:
  push:
    paths:
      - 'charts/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-oci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Determine tag
        run: echo "CHART_TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Helm login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Package and push chart as OCI
        run: |
          helm dependency update charts/dmonitor || true
          helm chart save charts/dmonitor ghcr.io/${{ github.repository_owner }}/dmonitor-chart:${{ env.CHART_TAG }}
          helm chart push ghcr.io/${{ github.repository_owner }}/dmonitor-chart:${{ env.CHART_TAG }}
