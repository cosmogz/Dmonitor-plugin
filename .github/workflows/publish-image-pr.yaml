name: Build and publish PR image

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-pr-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PR image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dmonitor:pr-${{ github.event.number }}
            ghcr.io/${{ github.repository_owner }}/dmonitor:pr-${{ github.event.number }}-${{ github.sha }}
          file: Dockerfile

      - name: Generate SBOM (Syft) and upload
        uses: anchore/syft-action@v0.8.1
        with:
          image: ghcr.io/${{ github.repository_owner }}/dmonitor:pr-${{ github.event.number }}-${{ github.sha }}
          output-file: dmonitor-pr-${{ github.event.number }}-${{ github.sha }}-sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmonitor-pr-sbom
          path: dmonitor-pr-${{ github.event.number }}-${{ github.sha }}-sbom.json

      - name: Scan image with Trivy (allowlist-aware)
        uses: aquasecurity/trivy-action@v1
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/dmonitor:pr-${{ github.event.number }}-${{ github.sha }}
          format: 'table'
          exit-code: '1'
          args: '--ignorefile .trivyignore --severity CRITICAL,HIGH'
*** End Patch