name: Backend CI

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Postgres
        uses: harmonicsh/postgresql-action@v1
        with:
          postgresql-version: '15'
          postgres-user: postgres
          postgres-password: postgres
          postgres-db: dmonitor

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend deps
        run: |
          cd backend
          npm ci

      - name: Run migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/dmonitor
        run: |
          cd backend
          npm run migrate

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/dmonitor
        run: |
          cd backend
          npm test --silent
