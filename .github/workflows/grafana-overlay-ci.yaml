name: Validate Grafana overlays

on:
  push:
    paths:
      - 'manifests/grafana/**'
  pull_request:
    paths:
      - 'manifests/grafana/**'

jobs:
  validate-overlays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubectl
        run: |
          set -e
          KUBECTL_VERSION=v1.26.0
          curl -fsSL -o kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          kubectl version --client
      # prefer kubectl kustomize (available in kubectl) to avoid unreliable tar downloads
      - name: Validate overlays (kubectl kustomize + kubectl dry-run)
        run: |
          set -e
          for overlay in manifests/grafana/overlay manifests/grafana/overlay/examples/official manifests/grafana/overlay/examples/bitnami; do
            echo "\n=== Validating $overlay ==="
            kubectl kustomize "$overlay" | kubectl apply --dry-run=client -f -
          done
