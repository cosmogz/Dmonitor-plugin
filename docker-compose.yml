version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: dmonitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54320:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "63790:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
