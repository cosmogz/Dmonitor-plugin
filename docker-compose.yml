version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: dmonitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - 6379:6379

  backend:
    build: ./backend
    ports:
      - 3000:3000
    env_file:
      - ./backend/.env.example
    depends_on:
      - db
      - redis

volumes:
  db-data:
version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: dmonitor
      POSTGRES_PASSWORD: dmonitor
      POSTGRES_DB: dmonitor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
