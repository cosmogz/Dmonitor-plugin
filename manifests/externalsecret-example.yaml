# Example ExternalSecret for external-secrets operator (AWS Secrets Manager example)
# Requires ExternalSecrets operator and a SecretStore configured for AWS/GCP/Vault per cluster.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dmonitor-openmrs-credentials
  namespace: default
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secretstore
    kind: SecretStore
  target:
    name: dmonitor-openmrs
    creationPolicy: Owner
  data:
    - secretKey: openmrs-url
      remoteRef:
        key: /dmonitor/openmrs/url
    - secretKey: openmrs-user
      remoteRef:
        key: /dmonitor/openmrs/user
    - secretKey: openmrs-password
      remoteRef:
        key: /dmonitor/openmrs/password
