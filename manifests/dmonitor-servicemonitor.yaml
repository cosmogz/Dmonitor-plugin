apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dmonitor-servicemonitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: dmonitor
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scheme: http
