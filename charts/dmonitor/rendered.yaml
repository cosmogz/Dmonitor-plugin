# Source: dmonitor/templates/podmonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: dmonitor-my-dmonitor-pm
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: dmonitor
  namespaceSelector:
    matchNames:
      - default
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
---
# Source: dmonitor/templates/prometheusrule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dmonitor-my-dmonitor-rules
  namespace: monitoring
spec:
  groups:
    - name: dmonitor.rules
      rules:
        - alert: OpenMRSIntegrationCircuitOpen
          expr: openmrs_circuit_open == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "OpenMRS integration circuit is open"
            description: "The Dmonitor to OpenMRS circuit breaker is open for more than 5 minutes."
---
# Source: dmonitor/templates/servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dmonitor-my-dmonitor-sm
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: dmonitor
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scheme: http
---
# Source: dmonitor/templates/test-connection-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: dmonitor-my-dmonitor-test-connection
  labels:
    app: dmonitor
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.1.0
          command:
            - "sh"
            - "-c"
            - |
              set -e
              TARGET=http://dmonitor-my-dmonitor:3000
              echo "Checking $TARGET/health"
              curl -fsS $TARGET/health
              echo "Checking $TARGET/version"
              curl -fsS $TARGET/version
              echo "Checking $TARGET/metrics"
              curl -fsS $TARGET/metrics | head -n 1
      restartPolicy: Never
