---
# Source: dmonitor/templates/grafana-dashboards-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: dmonitor-my-dmonitor-grafana-dashboards
  labels:
    app.kubernetes.io/name: dmonitor
    app.kubernetes.io/instance: my-dmonitor
data:
  dmonitor-dashboard.json: |-
    {
      "annotations": {"list":[]},
      "panels": [],
      "schemaVersion": 30,
      "title": "Dmonitor Overview",
      "version": 1
    }
---
# Source: dmonitor/templates/grafana-oidc-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: dmonitor-my-dmonitor-grafana-ini
  labels:
    app.kubernetes.io/name: dmonitor
    app.kubernetes.io/instance: my-dmonitor
data:
  grafana.ini: |
    [auth.generic_oauth]
    enabled = true
    name = keycloak
    allow_sign_up = true
    client_id = dmonitor-grafana
    client_secret = __FROM_SECRET__
    auth_url = https://auth.example.com
    token_url = https://auth.example.com
    api_url = https://auth.example.com
    ; set scopes
    scopes = openid,profile,email
    tls_skip_verify_insecure = false
---
# Source: dmonitor/templates/grafana-provisioning-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: dmonitor-my-dmonitor-grafana-provisioning
  labels:
    app.kubernetes.io/name: dmonitor
    app.kubernetes.io/instance: my-dmonitor
data:
  provisioning.yml: |
    apiVersion: 1
    providers:
      - name: 'Dmonitor'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
---
# Source: dmonitor/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: dmonitor-my-dmonitor
  labels:
    app.kubernetes.io/name: dmonitor
    app.kubernetes.io/instance: my-dmonitor
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dmonitor
    app.kubernetes.io/instance: my-dmonitor
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
# Source: dmonitor/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dmonitor-my-dmonitor
  labels:
    app.kubernetes.io/name: dmonitor
    app.kubernetes.io/instance: my-dmonitor
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dmonitor
      app.kubernetes.io/instance: my-dmonitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dmonitor
        app.kubernetes.io/instance: my-dmonitor
    spec:
      containers:
        - name: dmonitor
          image: "cosmogz/dmonitor:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: grafana-ini
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: grafana-ini
          configMap:
            name: dmonitor-my-dmonitor-grafana-ini
        - name: grafana-provisioning
          configMap:
            name: dmonitor-my-dmonitor-grafana-provisioning
        - name: grafana-dashboards
          configMap:
            name: dmonitor-my-dmonitor-grafana-dashboards
---
# Source: dmonitor/templates/external-secret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dmonitor-grafana-oidc
  labels:
    app.kubernetes.io/name: dmonitor
    app.kubernetes.io/instance: my-dmonitor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: my-secret-store
    kind: SecretStore
  target:
    name: dmonitor-grafana-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: dmonitor/oidc-client-secret
