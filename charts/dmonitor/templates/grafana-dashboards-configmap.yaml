{{- if and .Values.provisioning.enabled (kindIs "map" .Values.provisioning.dashboards) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dmonitor.fullname" . }}-grafana-dashboards
  labels:
    app.kubernetes.io/name: {{ include "dmonitor.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
{{- range $name, $content := .Values.provisioning.dashboards }}
  {{ $name }}: |-
{{ $content | indent 4 }}
{{- end }}
{{- end }}
