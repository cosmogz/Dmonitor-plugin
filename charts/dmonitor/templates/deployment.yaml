apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dmonitor.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "dmonitor.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dmonitor.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dmonitor.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: dmonitor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: PORT
              value: "{{ .Values.service.port }}"
          {{- if .Values.probes.liveness }}
          livenessProbe:
{{ toYaml .Values.probes.liveness | indent 12 }}
          {{- end }}
          {{- if .Values.probes.readiness }}
          readinessProbe:
{{ toYaml .Values.probes.readiness | indent 12 }}
          {{- end }}
          {{- if or .Values.oidc.enabled .Values.provisioning.enabled }}
          volumeMounts:
            {{- if .Values.oidc.enabled }}
            - name: grafana-ini
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
            {{- end }}
            {{- if .Values.provisioning.enabled }}
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
            {{- end }}
          {{- end }}
      {{- if or .Values.oidc.enabled .Values.provisioning.enabled }}
      volumes:
        {{- if .Values.oidc.enabled }}
        - name: grafana-ini
          configMap:
            name: {{ include "dmonitor.fullname" . }}-grafana-ini
        {{- end }}
        {{- if .Values.provisioning.enabled }}
        - name: grafana-provisioning
          configMap:
            name: {{ include "dmonitor.fullname" . }}-grafana-provisioning
        - name: grafana-dashboards
          configMap:
            name: {{ include "dmonitor.fullname" . }}-grafana-dashboards
        {{- end }}
      {{- end }}
