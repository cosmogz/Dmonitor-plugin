replicaCount: 2

image:
  repository: cosmogz/dmonitor
  tag: latest
  pullPolicy: IfNotPresent
  imagePullSecrets: []

service:
  type: ClusterIP
  port: 3000

metrics:
  path: /metrics
  port: http
  serviceMonitor:
    enabled: true
    namespace: monitoring

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

probes:
  liveness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
  readiness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3

nodeSelector: {}
tolerations: []
affinity: {}

# ServiceAccount
serviceAccount:
  create: false
  name: ""

# OIDC / OAuth configuration (for Grafana or app auth)
oidc:
  enabled: false
  provider: "generic"
  issuerUrl: ""
  clientID: ""
  clientSecret:
    create: false
    secretName: ""
    secretKey: "client-secret"
  redirectURI: ""
  scopes:
    - openid
    - profile
    - email
  tlsSkipVerify: false

# Grafana provisioning (provisioning by configmaps)
provisioning:
  enabled: false
  providerConfig: |-
    apiVersion: 1
    providers: []
  dashboards: {}

# ExternalSecrets integration (ExternalSecrets operator required)
externalSecrets:
  enabled: false
  secretStoreName: "my-secret-store"
  secretStoreKind: "SecretStore"
  createExternalSecret: false
  remoteKeyPrefix: "dmonitor/"
