replicaCount: 1

image:
  repository: busybox
  tag: "1.36"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

# OIDC / OAuth configuration (for Grafana or app auth)
# Enable and configure OIDC provider details below. Secrets are expected
# to be provided via existing Kubernetes Secrets or set `clientSecret.create`.
oidc:
  enabled: false
  provider: "generic"
  issuerUrl: ""
  clientID: ""
  # Do not put secrets here in plaintext. Prefer creating a K8s secret and
  # referencing it below. Set clientSecret.create=true to create a secret
  # from the provided value (not recommended for production).
  clientSecret:
    create: false
    # value: "" # Optional: secret value to create (not recommended)
    secretName: ""
    secretKey: "client-secret"
  redirectURI: ""
  scopes:
    - openid
    - profile
    - email
  tlsSkipVerify: false

# Grafana provisioning (provisioning by configmaps)
provisioning:
  enabled: false
  # providerConfig: raw YAML content for grafana provisioning providers file
  providerConfig: |-
    apiVersion: 1
    providers: []
  # dashboards: map of filename -> JSON/YAML content
  dashboards: {}

replicaCount: 2
image:
  repository: cosmogz/dmonitor
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 3000
metrics:
  path: /metrics
  port: http
  serviceMonitor:
    enabled: true
    namespace: monitoring
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
probes:
  liveness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
  readiness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
nodeSelector: {}
tolerations: []
affinity: {}
