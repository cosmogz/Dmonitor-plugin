apiVersion: batch/v1
kind: Job
metadata:
  name: dmonitor-migrate
spec:
  template:
    spec:
      containers:
        - name: migrate
          image: ghcr.io/{{REPO_OWNER}}/dmonitor-backend:latest
          command: ["node", "scripts/migrate.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dmonitor-secrets
                  key: DATABASE_URL
      restartPolicy: Never
  backoffLimit: 2
